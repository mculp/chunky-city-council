      else if (phase === 'town') { nooseRing.visible = knot.visible = false; S.removedNoose = true; ropeTop.visible = false; lantern.visible = false; bottle.visible = false; HP.kind = 'run'; player.pos.set(24, ROAD_TOP, 0); player.grounded = true; player.yaw = Math.PI / 2; cam.yaw = player.yaw + Math.PI; cam.snap = true; startTown(); }
      return this.state();
    },
    place(x, z, y) { player.pos.set(x, y ?? floorAt(x, z), z); player.grounded = true; player.vy = 0; cam.snap = true; return this.state(); },
    look(yaw, pitch) { cam.yaw = yaw; if (pitch !== undefined) cam.pitch = pitch; cam.snap = true; lastLook = time; },
    key(k, down = true) { k = k.toLowerCase(); if (down) { if (!keys.has(k)) { if (k === 'e' || k === 'enter') input.aEdge = true; if (k === ' ' || k === 'shift') input.bEdge = true; } keys.add(k); } else keys.delete(k); },
    stick(x, y) { touchStick.set(x, y); },
    choose(i) { $('dOpts').children[i].click(); return this.state(); },
    burst(pow = 1, dur = .5, hold = true, fine = true) { triggerBurst(pow, dur, hold, fine); },
    render(dt = 1 / 60) { renderFrame(dt); },
    calls() { const i = renderer.info; i.autoReset = false; i.reset(); tick(1 / 60); const r = { calls: i.render.calls, triangles: i.render.triangles, textures: i.memory.textures, geometries: i.memory.geometries }; i.autoReset = true; return r; }
  };
}
