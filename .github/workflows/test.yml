# Runs the node tests on every push to main, so a commit that breaks them shows up on GitHub.
# The browser suites need a real GPU and run on the Mac with tools/check.mjs. So does the one node test that times
# itself, "thinking about it all stays cheap": GitHub's shared machines are slower than a phone's budget allows for.
name: test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test -- --test-skip-pattern="stays cheap"
