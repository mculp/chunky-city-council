/* Layout: one full-bleed WebGL night scene; only the name, bottom-left. A single dark world by choice. */
:root{
  --night:#07050b;
  --cream:#f1e6cf;
  --rust:#ec803a;
  --cyan:#6fd6c8;
  --hot:#e3285c;
  --f-display:'Bungee','Impact','Arial Black',sans-serif;

}
html,body{height:100%}
body{background:var(--night);color:var(--cream);overflow:hidden;padding-block:0;

.plate{position:fixed;left:0;bottom:0;z-index:2;pointer-events:none;

  color:var(--cream);text-shadow:0 2px 0 var(--night),0 0 28px rgba(236,128,58,.35);text-wrap:balance;
  opacity:0;transform:translateY(8px);transition:opacity 1.4s ease,transform 1.4s ease}
.plate h1 span{color:var(--rust)}
.on .plate h1{opacity:1;transform:none}

#load{position:fixed;inset:0;z-index:3;background:var(--night);transition:opacity 1s}

@media (prefers-reduced-motion: reduce){.plate h1{transition:none}}

const G = { uStep: { value: 0 }, uRes: { value: new THREE.Vector2(1, 1) }, uBurst: { value: 0 }, uPxScale: { value: 1 } };

// ---------------------------------------------------------------- noise + canvas textures
function hash(x, y, s) {

function vnoise(x, y, s, P) {

const rustTex = (() => {

function makeHatch(seed, base, cols, n) {

function triplanar(tex, scale, params = {}) {
  const m = new THREE.MeshStandardMaterial({ map: tex, ...params });
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uTriScale = { value: scale };
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vTriP; varying vec3 vTriN;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        vec4 triW = vec4(transformed,1.);
        #ifdef USE_INSTANCING
          triW = instanceMatrix * triW;
        #endif
        vTriP=(modelMatrix*triW).xyz; vTriN=normalize(mat3(modelMatrix)*objectNormal);`);
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vTriP; varying vec3 vTriN; uniform float uTriScale;')
      .replace('#include <map_fragment>', `
        vec3 bw=pow(abs(normalize(vTriN)),vec3(4.)); bw/=(bw.x+bw.y+bw.z);
        vec4 tx=texture2D(map,vTriP.zy*uTriScale)*bw.x+texture2D(map,vTriP.xz*uTriScale)*bw.y+texture2D(map,vTriP.xy*uTriScale)*bw.z;
        diffuseColor*=tx;`);
  };
  return m;
}

// screen-space outlines; chalk=1 adds the hand-drawn boil and broken chalk texture
const outlineMats = new Map();
function outlineMat(color, px, chalk) {
  const key = color + '|' + px + '|' + chalk;
  if (outlineMats.has(key)) return outlineMats.get(key);
  const uniforms = Object.assign(THREE.UniformsUtils.clone(THREE.UniformsLib.fog), {
    uColor: { value: new THREE.Color(color) }, uPx: { value: px }, uChalk: { value: chalk },
    uStep: G.uStep, uRes: G.uRes, uPxScale: G.uPxScale

    side: THREE.BackSide, fog: true, uniforms,
    vertexShader: `uniform float uPx, uStep, uChalk, uPxScale; uniform vec2 uRes;
      #include <fog_pars_vertex>

class Sweep {
  constructor(nSeg, nRad, mat) {
    this.nSeg = nSeg; this.nRad = nRad;
    const n = (nSeg + 1) * (nRad + 1);
    this.pos = new Float32Array(n * 3); this.nor = new Float32Array(n * 3);
    const uvs = new Float32Array(n * 2), idx = [];
    for (let i = 0; i <= nSeg; i++) for (let j = 0; j <= nRad; j++) { const k = i * (nRad + 1) + j; uvs[k * 2] = j / nRad * 1.2; uvs[k * 2 + 1] = i / nSeg * 1.5; }
    for (let i = 0; i < nSeg; i++) for (let j = 0; j < nRad; j++) { const a = i * (nRad + 1) + j, b = (i + 1) * (nRad + 1) + j; idx.push(a, a + 1, b, b, a + 1, b + 1); }
    this.geo = new THREE.BufferGeometry();
    this.geo.setAttribute('position', new THREE.BufferAttribute(this.pos, 3));
    this.geo.setAttribute('normal', new THREE.BufferAttribute(this.nor, 3));
    this.geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
    this.geo.setIndex(idx);
    this.mesh = new THREE.Mesh(this.geo, mat); this.mesh.frustumCulled = false;
  }
  update(pts, radii) {
    const n = this.nSeg + 1, T = [];
    for (let i = 0; i < n; i++) T.push(new THREE.Vector3().subVectors(pts[Math.min(i + 1, n - 1)], pts[Math.max(i - 1, 0)]).normalize());
    const N = new THREE.Vector3(0, 0, 1); if (Math.abs(N.dot(T[0])) > .9) N.set(1, 0, 0);
    const B = new THREE.Vector3();
    for (let i = 0; i < n; i++) {
      N.addScaledVector(T[i], -N.dot(T[i])).normalize(); B.crossVectors(T[i], N);
      for (let j = 0; j <= this.nRad; j++) {
        const ph = j / this.nRad * Math.PI * 2, c = Math.cos(ph), s = Math.sin(ph);
        const nx = c * N.x + s * B.x, ny = c * N.y + s * B.y, nz = c * N.z + s * B.z, k = (i * (this.nRad + 1) + j) * 3, r = radii[i];
        this.pos[k] = pts[i].x + nx * r; this.pos[k + 1] = pts[i].y + ny * r; this.pos[k + 2] = pts[i].z + nz * r;
        this.nor[k] = nx; this.nor[k + 1] = ny; this.nor[k + 2] = nz;
      }
    }
    this.geo.attributes.position.needsUpdate = true; this.geo.attributes.normal.needsUpdate = true;
  }
}

const _d = new THREE.Vector3();
function ik(S, T, l1, l2, hint, out) {
  const d = Math.min(_d.subVectors(T, S).length(), l1 + l2 - 1e-3);
  const dir = _d.clone().normalize(); const a = (l1 * l1 + d * d - l2 * l2) / (2 * d), h = Math.sqrt(Math.max(l1 * l1 - a * a, 0));
  const pole = hint.clone().sub(S); pole.addScaledVector(dir, -pole.dot(dir)).normalize();
  return out.copy(S).addScaledVector(dir, a).addScaledVector(pole, h);
}
const S_R = new THREE.Vector3(.3, -.07, 0), S_L = new THREE.Vector3(-.3, -.07, 0);
const HINT_R = new THREE.Vector3(.8, -.35, -.25), HINT_L = new THREE.Vector3(-.7, -.4, -.2);

const MOUTH_TIP = MOUTH.p.clone().addScaledVector(MOUTH.n, -.012);
const REST_GRIP = new THREE.Vector3(.36, -.2, .24);

const st = { up: 0, tilt: 0, lag: 0 };
function setSleeve(arm, S, E, W, fdir) {
  const S0 = S.clone().add(new THREE.Vector3(-Math.sign(S.x) * .09, 0, 0));
  const pts = new THREE.CatmullRomCurve3([S0, S, E, W], false, 'centripetal').getSpacedPoints(arm.sleeve.nSeg);
  const radii = pts.map((_, k) => { const t = k / arm.sleeve.nSeg; return .108 - .03 * t + .008 * Math.exp(-(((t - .55) / .12) ** 2)); });
  arm.sleeve.update(pts, radii);
  arm.cuff.position.copy(W).addScaledVector(fdir, .005); arm.cuff.quaternion.setFromUnitVectors(UP, fdir);
}
function pose(tq) {
  const amp = .11 + .03 * Math.sin(tq * .13);
  swing.rotation.x = amp * Math.sin(tq * 1.95);
  swing.rotation.z = .05 * Math.sin(tq * 1.95 * 1.03 + 1.2);
  body.rotation.set(-.05 * Math.sin(tq * 1.95 - .5), -.3 + .26 * Math.sin(tq * .41), .025 * Math.sin(tq * .9));
  const kn = KNOT.clone().applyEuler(body.rotation);
  body.position.set(-kn.x, -ROPE_L - kn.y, -kn.z);
  rope.position.set(0, -ROPE_L / 2, 0); rope.scale.set(1, ROPE_L, 1);
  const lag = -swing.rotation.x; st.lag = lag;

  // drink: raise, tip it back, lower, hang
  const P = 6.4, ph = (tq % P) / P;
  const up = sstep(0, .14, ph) * (1 - sstep(.6, .74, ph)), tilt = sstep(.14, .5, ph) * (1 - sstep(.6, .7, ph));
  st.up = up; st.tilt = tilt; st.fill = .82 - .5 * sstep(.14, .6, ph) + .5 * sstep(.88, 1, ph);
  const el = THREE.MathUtils.lerp(-1.1, .42 + .32 * tilt, up) + .03 * Math.sin(tq * 5);
  const dir = new THREE.Vector3(HDIR.x * Math.cos(el), Math.sin(el), HDIR.z * Math.cos(el)).normalize();
  const gripUp = MOUTH_TIP.clone().addScaledVector(dir, .15);
  const grip = REST_GRIP.clone().add(new THREE.Vector3(.02 * Math.sin(tq * 1.95), 0, lag * .2)).lerp(gripUp, up);
  const tip = grip.clone().addScaledVector(dir, -.15);
  bottle.position.copy(tip).addScaledVector(dir, BOTTLE_L);
  bottle.quaternion.setFromUnitVectors(UP, dir.clone().negate());

  const E = new THREE.Vector3();
  for (let k = 0; k < 2; k++) { ik(S_R, wr, .33, .31, HINT_R, E); fdir = grip.clone().sub(E).normalize(); wr = grip.clone().addScaledVector(fdir, -.08); }
  setSleeve(armR, S_R, E, wr, fdir);

  faceLight.intensity = .55 * (.85 + .15 * Math.sin(tq * 9));

    const s = i ? 1 : -1, hip = HIPS[i];
    const ank = new THREE.Vector3(s * .135, -1.33, .04 + lag * .5 + .025 * Math.sin(tq * 1.95 + i)), K = new THREE.Vector3();
    ik(hip, ank, .34, .34, new THREE.Vector3(s * .1, -1, .8), K);
    const pts = new THREE.CatmullRomCurve3([hip.clone().add(new THREE.Vector3(0, .14, 0)), hip, K, ank], false, 'centripetal').getSpacedPoints(sw.nSeg);
    sw.update(pts, pts.map((_, k) => .118 - .035 * k / sw.nSeg));

  });

    const sway = new THREE.Vector3(.02 * Math.sin(tq * 1.95 + s.p.x * 20), 0, lag * .15);
    const P0 = s.p.clone().addScaledVector(s.n, .006);
    const P1 = P0.clone().addScaledVector(s.n, .02).add(new THREE.Vector3(0, -.04, 0));
    const P2 = P0.clone().addScaledVector(s.n, .025).add(new THREE.Vector3(0, -.11, 0)).addScaledVector(sway, .5); P2.z = Math.max(P2.z, .232);
    const P3 = P0.clone().addScaledVector(s.n, .022).add(new THREE.Vector3(0, -.19, 0)).add(sway); P3.z = Math.max(P3.z, .238);
    s.sw.update(new THREE.CatmullRomCurve3([P0, P1, P2, P3]).getSpacedPoints(8), new Array(9).fill(.0075));
    s.ag.position.copy(P3).add(new THREE.Vector3(0, -.012, 0)); s.ag.quaternion.setFromUnitVectors(UP, P3.clone().sub(P2).normalize());
  }

  const a = bottle.localToWorld(new THREE.Vector3(0, .014, 0)), b = bottle.localToWorld(new THREE.Vector3(0, .37, 0));
